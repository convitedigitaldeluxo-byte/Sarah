<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarah 15 anos — Pool Party</title>
<meta name="description" content="Convite de 15 anos da Sarah. Pool Party em 20/09/2026, das 13h30 às 18h30, na Rua Dr. João de Deus, 627 — Bairro de Fátima, Fortaleza.">
<meta name="theme-color" content="#220847">

<meta property="og:type" content="website">
<meta property="og:title" content="Sarah 15 anos — Pool Party">
<meta property="og:description" content="20/09/2026 · 13h30 às 18h30 · Rua Dr. João de Deus, 627 — Bairro de Fátima. Toque para confirmar presença.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --noite:#220847;
    --violeta:#7b4be0;
    --orquidea:#c77dff;
    --agua:#3fd3e8;
    --lilas:#ecdcff;
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    min-height:100svh;
    padding:clamp(14px,3vw,34px) clamp(12px,3vw,24px) calc(clamp(14px,3vw,34px) + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(16px,2.6vh,26px);
    font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--lilas);
    background:
      radial-gradient(120% 70% at 18% 8%, rgba(199,125,255,.38), transparent 60%),
      radial-gradient(110% 65% at 88% 26%, rgba(63,211,232,.28), transparent 62%),
      radial-gradient(130% 80% at 50% 108%, rgba(123,75,224,.34), transparent 58%),
      linear-gradient(168deg,var(--noite) 0%, #1a0638 52%, #10032a 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- cartão do convite ---------- */

  .convite{
    position:relative;
    width:min(100%, 30rem, calc(72vh * 9 / 16));
    width:min(100%, 30rem, calc(72svh * 9 / 16));
    aspect-ratio:9/16;
    margin-inline:auto;
    border-radius:26px;
    overflow:hidden;
    background:#1a0638;
    box-shadow:
      0 0 0 1px rgba(236,220,255,.16),
      0 2px 0 0 rgba(255,255,255,.10) inset,
      0 30px 70px -24px rgba(10,2,30,.9),
      0 0 90px -30px rgba(199,125,255,.55);
  }

  .convite video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* ---------- capa: toque para abrir ---------- */

  .abrir{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    padding:0 8% 13%;
    border:0;
    width:100%;
    font-family:"Cormorant Garamond",Georgia,serif;
    color:#fff;
    text-align:center;
    background:linear-gradient(to top, rgba(26,6,56,.78) 0%, rgba(26,6,56,.28) 38%, rgba(26,6,56,0) 62%);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .5s ease;
  }

  .abrir b{
    display:block;
    font-size:clamp(1.5rem,5.4vw,1.95rem);
    font-weight:500;
    letter-spacing:.012em;
    text-shadow:0 2px 14px rgba(26,6,56,.75);
  }

  .abrir i{
    font-family:"Jost",sans-serif;
    font-style:normal;
    font-size:clamp(.82rem,2.9vw,.95rem);
    color:rgba(255,255,255,.82);
    text-shadow:0 2px 10px rgba(26,6,56,.8);
  }

  .selo{
    width:clamp(62px,17vw,80px);
    aspect-ratio:1;
    margin-bottom:6px;
    display:grid;
    place-items:center;
    border-radius:50%;
    color:#fff;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.5), rgba(255,255,255,.08) 60%), linear-gradient(150deg,var(--orquidea),#9a5cf0);
    box-shadow:0 0 0 2px rgba(255,255,255,.6), 0 14px 34px -14px rgba(0,0,0,.85);
    animation:pulsar 2.4s ease-in-out infinite;
  }
  .selo svg{width:44%;height:44%}

  @keyframes pulsar{
    0%,100%{transform:scale(1)}
    50%    {transform:scale(1.07)}
  }

  .abrir:active .selo{transform:scale(.94)}
  .abrir:focus-visible{outline:3px solid #fff;outline-offset:-6px}

  .convite.iniciado .abrir{opacity:0;pointer-events:none}

  /* ---------- áreas clicáveis sobre os ícones do vídeo ---------- */

  .toque{
    position:absolute;
    top:76.5%;
    width:16%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border:0;
    padding:0;
    border-radius:50%;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .toque--presenca{left:37.6%}
  .toque--local{left:62%}

  .toque span{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip-path:inset(50%);
    white-space:nowrap;
  }

  .toque::after{
    content:"";
    position:absolute;
    inset:-9%;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.85);
    opacity:0;
    animation:chamar 2.6s ease-out infinite;
  }
  .toque--local::after{animation-delay:1.3s}

  @keyframes chamar{
    0%  {opacity:0;   transform:scale(.82)}
    22% {opacity:.85; transform:scale(1)}
    70% {opacity:0;   transform:scale(1.34)}
    100%{opacity:0;   transform:scale(1.34)}
  }

  .toque:focus-visible{outline:3px solid #fff;outline-offset:4px}

  /* enquanto o envelope abre, os ícones ainda não estão na tela */
  .convite:not(.aberto) .toque{pointer-events:none}
  .convite:not(.aberto) .toque::after{animation:none;opacity:0}

  /* ---------- som ---------- */

  .som{
    position:absolute;
    top:14px;right:14px;
    display:none;
    align-items:center;
    gap:7px;
    padding:8px 14px 8px 11px;
    font:500 .82rem/1 "Jost",sans-serif;
    color:#2a0a4d;
    background:rgba(255,255,255,.9);
    border:0;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 18px -8px rgba(0,0,0,.6);
  }
  .convite.iniciado .som{display:inline-flex}
  .som svg{width:16px;height:16px;flex:none}
  .som:focus-visible{outline:3px solid #fff;outline-offset:3px}

  /* ---------- botões e rodapé ---------- */

  .acoes{
    width:min(100%,30rem);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .botao{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    min-height:52px;
    padding:0 14px;
    font:500 1rem/1.2 "Jost",sans-serif;
    text-align:center;
    text-decoration:none;
    border-radius:16px;
    transition:transform .16s ease, filter .16s ease;
  }
  .botao svg{width:19px;height:19px;flex:none}

  .botao--presenca{
    color:#28063f;
    background:linear-gradient(140deg,var(--orquidea),#a066f2 70%);
    box-shadow:0 12px 26px -14px rgba(199,125,255,.95);
  }
  .botao--local{
    color:#05303a;
    background:linear-gradient(140deg,var(--agua),#79e6f2 70%);
    box-shadow:0 12px 26px -14px rgba(63,211,232,.9);
  }
  .botao:hover{filter:brightness(1.06)}
  .botao:active{transform:translateY(1px)}
  .botao:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .endereco{
    width:min(100%,30rem);
    margin:0;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:clamp(1.02rem,2.9vw,1.2rem);
    line-height:1.45;
    text-align:center;
    color:rgba(236,220,255,.82);
  }
  .endereco strong{display:block;font-weight:600;color:#fff}

  @media (max-width:380px){
    .acoes{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    .selo,.toque::after{animation:none}
    .toque::after{opacity:.5}
    .botao,.abrir{transition:none}
  }
</style>
</head>
<body>

  <main class="convite" id="cartao">
    <video id="video" src="convite-sarah.mp4" poster="poster.jpg"
           loop playsinline preload="auto"
           aria-label="Convite animado de 15 anos da Sarah"></video>

    <button class="abrir" id="abrir" type="button">
      <span class="selo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </span>
      <b>Toque para abrir</b>
      <i>com som</i>
    </button>

    <button class="som" id="som" type="button" aria-pressed="true">
      <svg id="somIcone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      <span id="somTexto"></span>
    </button>

    <a class="toque toque--presenca"
       href="https://wa.me/5585987934758?text=Confirmo%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20da%20Sarah."
       target="_blank" rel="noopener">
      <span>Confirmar presença pelo WhatsApp</span>
    </a>

    <a class="toque toque--local"
       href="https://www.google.com/maps/search/?api=1&amp;query=-3.7455455%2C-38.5277097&amp;query_place_id=ChIJH4oh7h1JxwcRwsHkxEyJN7g"
       target="_blank" rel="noopener">
      <span>Ver a localização no mapa</span>
    </a>
  </main>

  <nav class="acoes">
    <a class="botao botao--presenca"
       href="https://wa.me/5585987934758?text=Confirmo%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20da%20Sarah."
       target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2m5.8 14.06c-.24.68-1.42 1.31-1.96 1.36-.5.05-.98.24-3.3-.69-2.77-1.09-4.53-3.92-4.67-4.1-.14-.18-1.12-1.49-1.12-2.85s.71-2.02.97-2.3c.25-.27.55-.34.73-.34s.37 0 .53.01c.17.01.4-.06.62.48.24.55.8 1.91.87 2.05s.12.31.02.49c-.09.18-.14.29-.28.45-.14.16-.29.36-.42.48-.14.14-.28.29-.12.57s.72 1.18 1.54 1.91c1.06.94 1.95 1.23 2.23 1.37.28.14.44.12.6-.07s.69-.8.88-1.08c.18-.28.37-.23.62-.14s1.6.75 1.87.89c.28.14.46.21.53.32.07.12.07.66-.17 1.29"/>
      </svg>
      Confirmar presença
    </a>

    <a class="botao botao--local"
       href="https://www.google.com/maps/search/?api=1&amp;query=-3.7455455%2C-38.5277097&amp;query_place_id=ChIJH4oh7h1JxwcRwsHkxEyJN7g"
       target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>
      </svg>
      Ver localização
    </a>
  </nav>

  <p class="endereco">
    <strong>Rua Dr. João de Deus, 627 — Bairro de Fátima, Fortaleza</strong>
    20 de setembro de 2026, das 13h30 às 18h30
  </p>

<script>
(function(){
  var cartao = document.getElementById('cartao');
  var video  = document.getElementById('video');
  var capa   = document.getElementById('abrir');
  var som    = document.getElementById('som');
  var icone  = document.getElementById('somIcone');
  var texto  = document.getElementById('somTexto');

  var COM_SOM = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
  var SEM_SOM = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>';

  function pintarSom(){
    var ligado = !video.muted;
    icone.innerHTML   = ligado ? COM_SOM : SEM_SOM;
    texto.textContent = ligado ? 'Som ligado' : 'Ativar som';
    som.setAttribute('aria-pressed', ligado ? 'true' : 'false');
  }

  // o toque na capa libera o som: é um gesto do usuário, então o navegador permite
  capa.addEventListener('click', function(){
    cartao.classList.add('iniciado');
    video.muted = false;
    video.volume = 1;

    var tentativa = video.play();
    if(tentativa && tentativa.catch){
      tentativa.catch(function(){
        // navegador recusou o som: toca sem áudio e deixa o botão à mostra
        video.muted = true;
        pintarSom();
        video.play().catch(function(){});
      });
    }
    pintarSom();
  });

  som.addEventListener('click', function(){
    video.muted = !video.muted;
    if(!video.muted){ video.volume = 1; }
    video.play().catch(function(){});
    pintarSom();
  });

  // o envelope leva cerca de 6s para abrir; antes disso os ícones não existem na tela
  video.addEventListener('timeupdate', function(){
    cartao.classList.toggle('aberto', video.currentTime >= 6);
  });

  pintarSom();
})();
</script>
</body>
</html>
